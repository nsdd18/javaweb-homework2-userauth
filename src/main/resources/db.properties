# ============================================================
#  数据库连接配置
#  ----------------------------------------------------------
#  url      : JDBC 连接串（库名 javaweb_homework，UTF-8 编码）
#             注意：characterEncoding 必须写 UTF-8，
#             写 utf8mb4 会报 "Unsupported character encoding 'utf8mb4'"
#  username : 应用专用账号 javaweb（不是 root，只对本库有权限）
#  password : 应用账号密码，改库密码时同步修改这里
#  ----------------------------------------------------------
#  注意：该文件打包后位于 WEB-INF/classes/db.properties
# ============================================================
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/javaweb_homework?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.username=javaweb
db.password=javaweb123
